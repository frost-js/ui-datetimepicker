<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/assets/frost-ui.css">
    <link rel="stylesheet" href="/assets/frost-ui-datetimepicker.css">
    <script type="importmap">
        {
            "imports": {
                "@fr0st/core": "/assets/frost-core.esm.js",
                "@fr0st/query": "/assets/fquery.esm.js",
                "@fr0st/ui": "/assets/frost-ui.esm.js",
                "@fr0st/datetime": "/assets/frost-datetime.esm.js"
            }
        }
    </script>
    <title>Frost UI DateTimePicker ESM tests</title>
</head>
<body>
    <script type="module">
        import fQuery from '@fr0st/query';
        import DateTime from '@fr0st/datetime';
        import * as UI from '@fr0st/ui';

        const suffix = new URLSearchParams(location.search).has('min') ? '.min' : '';
        const { default: DateTimePicker } = await import(`/assets/frost-ui-datetimepicker.esm${suffix}.js`);
        window.fQuery = fQuery;
        window.DateTime = DateTime;
        window.UI = { ...UI, DateTimePicker };
    </script>
</body>
</html>
